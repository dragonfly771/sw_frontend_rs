[package]
name = "corelib"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
embedded-graphics = "0.8.0"
u8g2-fonts = "0.3.0"
micromath = { version = "2.0", default-features = false }
num = { version = "0.4.0", default-features = false }
num_enum = { version = "0.7.3", default-features = false }
heapless = "0.8"
tfmt = "0.4"
byteorder = { version = "1.4", default-features = false }
defmt = "0.3"
portable-atomic = { version = "1", default-features = false }

[dev-dependencies]
chrono = "0.4.44"

[features]
default = ["colors_8_indexed", "eeprom_size_8192"]
colors_8_indexed = []
colors_rgb565 = []
eeprom_size_8192 = []
# FLARM traffic, warnings, radar page and the SteFly canopy flasher. Parked for the test
# versions (Stefan 15.11.2026): without this feature nothing of it shows in a menu, on a
# page or in the device info, and the controller does not run it. See flarm_feature_parked.md
flarm = []
# The FLARM port is tested with its feature: without it the target table is
# cut down to two entries (flarm::traffic::MAX_TARGETS).
[[test]]
name = "flarm"
path = "tests/flarm.rs"
required-features = ["flarm"]

[lints.rust]
# the FLARM port and the flap model can be type checked standalone (tools/)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flarm_standalone)', 'cfg(flaps_standalone)'] }
